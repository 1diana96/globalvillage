<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Reservation</title>
    <link rel="stylesheet" href="reservations.css">
</head>
<body>
     <h1>Global Village Restaurant</h1>
    <div class="nav">
        <a href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="reservations.html">Reservations</a>
        <a href="directions.html">Directions</a>
    </div>

 <div class="reservation-container">

        <div class="reservation-text">

            <h2>Reserve Your Table</h2>

            <p>
                Enjoy flavors from South Asia, Central America, and South America
                in a warm and welcoming atmosphere.
            </p>

            <img src="restaurant-reservations.jpeg"
            alt="Restaurant dining table">

        </div>


        <!-- FORM -->

        <div class="reservation-form">

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">


                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">


                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number">


                <label for="guests">Number of Guests</label>
                <input type="number" id="guests" min="1">


                <label for="date">Reservation Date</label>
                <input type="date" id="date">


                <label for="time">Reservation Time</label>
                <input type="time" id="time">


                <button type="submit">Book Reservation</button>

            </form>

        </div>

    </div>
</body>
</html>
